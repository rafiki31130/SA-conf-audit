[secrets]
# Complements encrypt_fields (server.conf), which is always read at runtime (canonical source).
# Comma-separated glob patterns, case-insensitive, matched against key names.
extra_key_patterns = pass4SymmKey, sslPassword, *password*, *secret*, *token*
# Comma-separated glob patterns matched against stanza names: every key of a matching stanza is sensitive.
extra_stanza_patterns = credential*
# Confs where the two pattern lists above do NOT apply. Comma-separated EXACT conf names
# (case-sensitive, no globs). encrypt_fields is never excluded, so a real secret stays hashed even
# in a conf listed here. Only list a conf whose value space cannot hold a credential: the defaults
# below carry capability switches, feature flags, extraction rules, KV-store field types and the
# machine-generated file-classifier term frequencies - places where *token* / *password* only ever
# match a NAME. Justification per conf in the README.
pattern_excluded_confs = authorize, collections, fields, multikv, sourcetypes, web-features

[logging]
# CRITICAL | ERROR | WARNING | INFO | DEBUG
level = INFO

[rest]
# TLS verification for the loopback splunkd REST calls (capability check, serverName).
# true: chain verified against $SPLUNK_HOME/etc/auth/cacert.pem, hostname check disabled
#       (splunkd_uri is a loopback address; default Splunk certs carry no matching SAN).
# false: no verification (single startup warning emitted).
verify_ssl = true
