[confbtool-command]
syntax = | confbtool <conf-name-or-list-or-star> (stanza=<wc-string>)? (key=<wc-string>)? (app=<wc-string>)? (audit=<bool>)? (debug=<bool>)?
shortdesc = Audit the file origin of configuration definitions, like btool --debug, in SPL.
description = Generating command. Emits one row per configuration definition (file x conf x stanza x key). \
    The field set AND the column order are fixed by mode, and come out as such with no | table. \
    audit=false debug=false (default), 6 fields: conf stanza key value anomaly member. \
    audit=false debug=true, 11 fields: app layer scope conf stanza key value definition_count file_path anomaly member. \
    audit=true (any debug), 15 fields: app layer scope conf stanza key value is_btool_winner btool_winner_value \
    precedence_rank definition_count file_path btool_winner_path anomaly member. \
    A field a mode does not carry is not emitted at all, never emitted empty; audit=true implies debug=true. \
    audit=false emits winning definitions only; audit=true emits every concurrent definition, winners and shadowed. \
    app= restricts to keys carried by the matching app(s); combined with audit=true \
    it extrapolates: all concurrent definitions of those keys are emitted, other apps and system included. \
    The app field reads system for definitions of etc/system, and app=system selects that layer: whatever a field \
    displays is selectable by the filter that corresponds to it. Requires the run_confbtool capability.
usage = public
tags = conf btool audit configuration precedence
example1 = | confbtool authorize
comment1 = Winning authorize.conf definitions, one row per definition. Add debug=true for the file origin.
example2 = | confbtool authorize app=00_corp_base audit=true
comment2 = Every definition of every authorize.conf key carried by app 00_corp_base, concurrents included.
example3 = | confbtool * app=00_corp_base audit=true | where is_btool_winner="false" AND app="00_corp_base"
comment3 = Dead definitions of the app (shadowed by another layer), with the shadowing file in btool_winner_path.
example4 = | confbtool props app=system audit=true
comment4 = Every definition of every props.conf key carried by etc/system/{local,default}, competing apps included.
