[confbtool-command]
syntax = | confbtool <conf-name-or-list-or-star> (stanza=<wc-string>)? (key=<wc-string>)? (app=<wc-string>)? (audit=<bool>)? (debug=<bool>)?
shortdesc = Audit the file origin of configuration definitions, like btool --debug, in SPL.
description = Generating command. Emits one row per configuration definition (file x conf x stanza x key), \
    with the file path, the global precedence rank and the btool winner verdict. \
    audit=false (default) emits winning definitions only; audit=true emits every concurrent definition, \
    winners and shadowed. app= restricts to keys carried by the matching app(s); combined with audit=true \
    it extrapolates: all concurrent definitions of those keys are emitted, other apps and system included. \
    debug=true (default) fills file_path on every row. Requires the run_confbtool capability.
usage = public
tags = conf btool audit configuration precedence
example1 = | confbtool authorize
comment1 = Winning authorize.conf definitions, one row per definition, with file origin.
example2 = | confbtool authorize app=00_corp_base audit=true
comment2 = Every definition of every authorize.conf key carried by app 00_corp_base, concurrents included.
example3 = | confbtool * app=00_corp_base audit=true | where is_btool_winner="false" AND app="00_corp_base"
comment3 = Dead definitions of the app (shadowed by another layer), with the shadowing file in btool_winner_path.
